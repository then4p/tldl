# tldl configuration. Strings may reference environment variables as
# ${VAR} or ${VAR:-default}.
#
# Every voice message gets two passes: NVIDIA Parakeet sends a quick transcript
# within seconds, then Whisper large-v3-turbo replaces it with a more accurate
# one. Models download from Hugging Face on first use.

threads: 6                 # CPU threads per model (matches TLDL_CPUS); 0 = one per physical core
max_duration: 1800         # seconds; longer voice messages are rejected
state_file: data/state.json

# Checks every few minutes that each messenger still works (e.g. WhatsApp
# logged the bot out, or Signal blocks an outdated bridge) and tells you.
# Status is also served at :8000/healthz (JSON) and :8000/metrics (Prometheus).
health:
  interval: 300            # seconds between checks
  # alert:                 # where to send problems; without it they're only logged
  #   messenger: telegram
  #   chat_id: "123456789" # your chat with the bot (for Telegram: your user id)
  remind_every: 86400      # repeat the alert daily while it's still broken

# HTTP server: webhooks (WhatsApp/WAHA), /healthz and /metrics.
http:
  host: 0.0.0.0
  port: 8000

# ---------------------------------------------------------------------------
# Messengers. Set `enabled: false` to switch one off. Anyone who can message
# the bot can use it.
# ---------------------------------------------------------------------------
messengers:
  telegram:
    type: telegram
    token: ${TELEGRAM_BOT_TOKEN}

  signal:
    type: signal
    enabled: false
    url: http://signal-api:8080
    number: ${SIGNAL_NUMBER}  # the account registered/linked in signal-cli-rest-api
    note_to_self: false       # true: linked to your own account, use "Note to Self"

  whatsapp:
    type: whatsapp-waha
    enabled: false
    url: http://waha:3000
    session: default
    api_key: ${WAHA_API_KEY}
    webhook_token: ${WEBHOOK_TOKEN}   # WAHA's hook URL must end with ?token=<same value>
    self_chat: false          # true: linked to your own account, use "Message yourself"

[project]
name = "tldl"
version = "0.2.0"
description = "Self-hosted voice message transcription bot for Telegram, Signal and WhatsApp"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "numpy>=2.3",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "pyyaml>=6.0.3",
    "tzdata",  # zoneinfo data for access.timezone, independent of the OS image
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tldl = "tldl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tldl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
